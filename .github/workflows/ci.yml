name: CI
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  semgrep:
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/security-audit p/secrets p/owasp-top-ten"

  test:
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build builder stage
        run: docker build --target builder -t minitwit:builder .

      - name: Run Go tests
        run: docker run --rm minitwit:builder go test -v ./...

      - name: Build final image
        run: docker build -t minitwit:ci .

      - name: Run API tests with docker compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm tests sh -c "
            pip install --upgrade pip &&
            pip install -r requirements.txt &&
            pytest python-references/minitwit_sim_api_test.py -v
          "

      - name: Run Playwright browser tests with docker compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm tests sh -c "
            pip install --upgrade pip &&
            pip install -r requirements.txt &&
            playwright install --with-deps &&
            pytest python-references/minitwit_ui_browser_test.py -v
          "

      - name: Compose down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  docker-scout:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t minitwit:ci .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: minitwit:ci
          severity: critical,high
          exit-code: true