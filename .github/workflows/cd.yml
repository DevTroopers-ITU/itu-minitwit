name: CD

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          docker build -t ghcr.io/devtroopers-itu/minitwit:latest .
          docker build -t ghcr.io/devtroopers-itu/minitwit-prometheus:latest ./monitoring/prometheus
          docker build -t ghcr.io/devtroopers-itu/minitwit-grafana:latest ./monitoring/grafana
          docker push ghcr.io/devtroopers-itu/minitwit:latest
          docker push ghcr.io/devtroopers-itu/minitwit-prometheus:latest
          docker push ghcr.io/devtroopers-itu/minitwit-grafana:latest

      - name: Deploy to Swarm (DigitalOcean)
        uses: appleboy/ssh-action@v1
        with:
          host: 64.226.116.162
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          # Pass a long-lived PAT so the credentials handed to workers via
          # `--with-registry-auth` do not expire before the workers pull.
          # Using the workflow's ephemeral GITHUB_TOKEN (a `ghs_*` token) here
          # caused workers to reject tasks with "No such image" — see the
          # incident on 21 Apr 2026. The PAT must have `read:packages` scope.
          envs: GHCR_DEPLOY_PAT,GHCR_DEPLOY_USER
          script: |
            set -euo pipefail
            cd /root/itu-minitwit
            git pull origin master
            echo "$GHCR_DEPLOY_PAT" | docker login ghcr.io -u "$GHCR_DEPLOY_USER" --password-stdin
            docker stack deploy -c docker-stack.yml minitwit --with-registry-auth
        env:
          GHCR_DEPLOY_PAT: ${{ secrets.GHCR_DEPLOY_PAT }}
          GHCR_DEPLOY_USER: ${{ secrets.GHCR_DEPLOY_USER }}
