name: Report

on:
  push:
    branches: [master, dev]
    paths: [report/**]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-luatex texlive-fonts-recommended texlive-latex-extra texlive-lang-european
          PANDOC_VERSION=$(curl -s https://api.github.com/repos/jgm/pandoc/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -sLo pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb

      - name: Build PDF
        run: |
          mkdir -p report/build
          cd report
          pandoc report.md \
            -o build/MSc_group_q.pdf \
            --pdf-engine=lualatex \
            --resource-path=.

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/build/MSc_group_q.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: rebuild report PDF"
            git push
          fi
